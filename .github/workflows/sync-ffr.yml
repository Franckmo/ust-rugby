name: Synchronisation FFR
on:
  schedule:
    - cron: '17 7,12,19 * * *'
    - cron: '2-59/5 12-19 * * 0' # Dimanche heures de match UTC ; évite les minutes rondes chargées
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_ffr.py'
      - '.github/workflows/sync-ffr.yml'
permissions:
  contents: write
concurrency:
  group: ffr-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: |
          pip install 'beautifulsoup4>=4.12,<5' 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium
      - name: Récupérer et contrôler les données FFR
        run: python scripts/sync_ffr.py
      - name: Enregistrer seulement si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffr-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les données officielles FFR"
            # Une modification concomitante du dépôt ne doit pas bloquer la publication.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            echo "Impossible de publier les données après 4 tentatives" >&2
            exit 1
          fi
