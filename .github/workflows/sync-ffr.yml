name: Synchronisation FFR
on:
  schedule:
    - cron: '15 7,12,19 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sync_ffr.py'
      - '.github/workflows/sync-ffr.yml'
permissions:
  contents: write
concurrency:
  group: ffr-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - name: Récupérer et contrôler les données FFR
        run: python scripts/sync_ffr.py
      - name: Enregistrer seulement si les données ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ffr-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser les données officielles FFR"
            git push
          fi
